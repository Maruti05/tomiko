[versions]
agp = "9.3.1"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
appcompat = "1.8.0"
window = "1.5.1"
navigation = "2.10.2"
coroutines = "1.11.0"
serialization = "1.13.0"
